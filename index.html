<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Rekenen</title>
<meta name="description" content="Oefen maal- en deeltafels en plus- en minsommen tot 100.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rekenen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    overscroll-behavior: none;   /* no rubber-band scrolling in the installed app */
    background: #ffffff;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: flex-start;
    min-height: 100vh;
    min-height: 100dvh;          /* on mobile 100vh is the large viewport */
  }
  #app {
    /* Above #backdrop, so the drawings never land on top of a question. */
    position: relative;
    z-index: 1;
    /* Align to the top instead of centring vertically: an on-screen
       keyboard shrinks the viewport, and centred content then jumps up and
       down every time that keyboard appears or disappears.
       The same everywhere, not just on touch: an iPad with a keyboard or
       mouse reports itself as a device with a fine pointer, so an exception
       for mice would still leave it jumping. */
    margin: 0 auto;
    width: 100%;
    max-width: 640px;
    padding: max(32px, env(safe-area-inset-top))
             max(24px, env(safe-area-inset-right))
             max(32px, env(safe-area-inset-bottom))
             max(24px, env(safe-area-inset-left));
  }
  button {
    font: inherit;
    touch-action: manipulation;          /* no double-tap zoom */
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: #888;
    font-size: 15px;
    margin: 0 0 32px;
  }
  .version {
    color: #ccc;
    font-size: 12px;
    text-align: right;
    margin: 20px 0 0;
  }

  /* Mode screen */
  .mode-btn {
    display: block;
    width: 100%;
    padding: 24px;
    margin-bottom: 14px;
    font-size: 20px;
    font-weight: 600;
    text-align: left;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    background: #fff;
    color: #1a1a1a;
    cursor: pointer;
    transition: all .12s ease;
  }
  .mode-btn:active { border-color: #2563eb; }
  .mode-btn .mode-desc {
    display: block;
    margin-top: 6px;
    font-size: 14px;
    font-weight: 400;
    color: #888;
  }
  .back-btn {
    border: none;
    background: none;
    padding: 0;
    margin: 0 0 16px;
    font-size: 15px;
    color: #888;
    cursor: pointer;
  }
  .back-btn:active { color: #1a1a1a; }

  /* Setup screen */
  .section-label {
    font-size: 14px;
    color: #666;
    margin: 0 0 12px;
  }
  .numbers {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .num-btn {
    padding: 16px 0;
    font-size: 20px;
    font-weight: 600;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    background: #fff;
    color: #1a1a1a;
    cursor: pointer;
    transition: all .12s ease;
    user-select: none;
  }
  .num-btn:active { border-color: #bbb; }
  .num-btn.selected {
    border-color: #2563eb;
    background: #2563eb;
    color: #fff;
  }
  .start-btn {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    transition: opacity .12s ease;
  }
  .start-btn:active { opacity: .85; }
  .start-btn:disabled { opacity: .3; cursor: not-allowed; }

  /* Quiz screen */
  .progress {
    font-size: 14px;
    color: #888;
    margin-bottom: 24px;
    text-align: center;
  }
  .question {
    font-size: 44px;
    font-weight: 600;
    margin: 24px 0 24px;
    text-align: center;
    letter-spacing: 1px;
  }
  .answer-input {
    width: 100%;
    padding: 18px;
    font-size: 28px;
    text-align: center;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    outline: none;
    -moz-appearance: textfield;
  }
  .answer-input::-webkit-outer-spin-button,
  .answer-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .answer-input:focus { border-color: #2563eb; }
  .answer-input.correct { border-color: #16a34a; background: #f0fdf4; color: #16a34a; }
  .answer-input.wrong { border-color: #dc2626; background: #fef2f2; color: #dc2626; }
  .feedback {
    text-align: center;
    font-size: 16px;
    margin-top: 16px;
    min-height: 24px;
    font-weight: 500;
  }
  .feedback.correct { color: #16a34a; }
  .feedback.wrong { color: #dc2626; }
  .next-btn {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    margin-top: 24px;
  }
  .next-btn:active { opacity: .85; }
  .next-btn:disabled { opacity: .3; cursor: not-allowed; }

  /* Result screen */
  .score {
    font-size: 64px;
    font-weight: 700;
    text-align: center;
    margin: 8px 0 8px;
  }
  .score-label {
    text-align: center;
    color: #888;
    font-size: 16px;
    margin-bottom: 32px;
  }
  .review {
    border-top: 1px solid #eee;
    padding: 14px 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
  }
  .review .mark { font-size: 20px; }
  .review .given { color: #888; font-size: 15px; }
  .hidden { display: none; }

  /* Hover sticks after a tap on touch, so only for real mice. */
  @media (hover: hover) and (pointer: fine) {
    .mode-btn:hover { border-color: #2563eb; }
    .back-btn:hover { color: #1a1a1a; }
    .num-btn:hover { border-color: #bbb; }
    .start-btn:hover { opacity: .85; }
    .next-btn:hover { opacity: .85; }
    .next-btn:disabled:hover { opacity: .3; }
    .start-btn:disabled:hover { opacity: .3; }
  }

  #confetti {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  /* --- Drawings in the background ---
     Fixed and clipped, so the drawings stay put along the edges of the
     screen while a long result list scrolls past them. pointer-events: none
     means a tap always goes through to the button or input underneath, and
     #app sits on a higher layer so text is never drawn over.
     Anchored to the top, and the height is pinned in pixels by
     sizeBackdrop(): a viewport that shrinks under an on-screen keyboard
     would otherwise drag every drawing up and down with it. The 100dvh here
     is only the starting point until that script runs. */
  #backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    transition: opacity .3s ease;
  }
  /* The list of answers is the one screen that can fill the whole height, so
     there the drawings step back while the answers are being read back. */
  body.reading #backdrop { opacity: .45; }
  .doodle {
    position: absolute;
    height: auto;
    /* Only fade in once the drawing is there, so it does not pop into view
       halfway through the first question. */
    opacity: 0;
    animation: doodle-in .8s ease forwards;
  }
  @keyframes doodle-in { to { opacity: var(--doodle-opacity); } }

  /* Spread over the height in a zig-zag - top right, left, right, bottom
     left - so the middle of the screen is not left bare. The two in the
     middle hang off the side edges, where they stay clear of the question
     and the answer box in the centre column.
     Opacity per drawing, because a dense felt-tip sun carries much further
     at the same opacity than a pale crayon face. */
  .doodle-sun    { --doodle-opacity: .16; width: 170px; top: -56px; right: -54px; transform: rotate(8deg); }
  .doodle-hearts { --doodle-opacity: .22; width: 145px; top: 40%; left: -10px; transform: translateY(-50%) rotate(-8deg); }
  .doodle-bunny  { --doodle-opacity: .24; width: 100px; top: 64%; right: -18px; transform: translateY(-50%) rotate(8deg); }
  /* Clear of the bottom 90-odd pixels: that is where a full-width button
     lands once the list of answers is scrolled to its end, and on a phone
     there is no side margin to dodge into. */
  .doodle-face   { --doodle-opacity: .30; width: 140px; bottom: 108px; left: -16px; transform: rotate(-6deg); }

  /* Plenty of room beside the 640px column: bigger, and fully in view. */
  @media (min-width: 900px) {
    .doodle-sun    { width: 250px; top: -50px; right: 24px; }
    .doodle-hearts { width: 200px; top: 38%; left: 30px; }
    .doodle-bunny  { width: 140px; top: 66%; right: 46px; }
    .doodle-face   { width: 240px; bottom: 16px; left: 28px; }
  }

  /* A phone on its side is almost all content: there is no free middle to
     fill, so only the two corner drawings stay.
     On a class from sizeBackdrop() rather than a max-height media query,
     because a keyboard shrinks the viewport too and would make these two
     drawings blink away and back with every answer. */
  body.compact .doodle-hearts,
  body.compact .doodle-bunny { display: none; }
  body.compact .doodle-face  { width: 140px; bottom: -40px; }
  body.compact .doodle-sun   { width: 140px; }

  @media (prefers-reduced-motion: reduce) {
    .doodle { animation: none; opacity: var(--doodle-opacity); }
  }
</style>
</head>
<body>
<canvas id="confetti" class="hidden"></canvas>

<!-- Decoration only, so hidden from screen readers. -->
<div id="backdrop" aria-hidden="true">
  <img class="doodle doodle-sun" src="drawings/tekening_4.png" alt="" width="309" height="340" decoding="async">
  <img class="doodle doodle-face" src="drawings/tekening_1.png" alt="" width="255" height="279" decoding="async">
  <img class="doodle doodle-bunny" src="drawings/tekening_3.png" alt="" width="147" height="219" decoding="async">
  <img class="doodle doodle-hearts" src="drawings/tekening_2.png" alt="" width="284" height="99" decoding="async">
</div>

<div id="app">

  <!-- MODE -->
  <div id="mode">
    <h1>Rekenen</h1>
    <p class="subtitle">Wat wil je oefenen?</p>
    <button class="mode-btn" id="modeTablesBtn">
      Maal- en deeltafels
    </button>
    <button class="mode-btn" id="modePlusMinusBtn">
      Plus en min tot 100
    </button>
    <p class="version" id="version"></p>
  </div>

  <!-- SETUP (times tables) -->
  <div id="setup" class="hidden">
    <button class="back-btn" id="backBtn">← Ander spel</button>
    <h1>Tafels oefenen</h1>
    <p class="subtitle">Kies welke tafels je wil oefenen en beantwoord 10 vragen.</p>
    <p class="section-label">Basisgetallen</p>
    <div class="numbers" id="numbers"></div>
    <button class="start-btn" id="startBtn" disabled>Start (kies minstens één)</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <p class="progress" id="progress"></p>
    <div class="question" id="question"></div>
    <input class="answer-input" id="answerInput" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
    <p class="feedback" id="feedback"></p>
    <button class="next-btn" id="checkBtn" disabled>Controleer</button>
    <button class="next-btn hidden" id="nextBtn">Volgende</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <div class="score" id="score"></div>
    <p class="score-label">van de 10 juist</p>
    <p class="score-label" id="timeLabel" style="margin-top:-24px;"></p>
    <div id="reviewList"></div>
    <button class="start-btn" id="againBtn" style="margin-top:32px;">Opnieuw spelen</button>
  </div>

</div>

<script>
(function () {
  // Bump this together with CACHE in sw.js on every deploy.
  var APP_VERSION = 'v6';
  var NUM_QUESTIONS = 10;
  var MAX_VALUE = 100;          // every number and answer stays between 0 and 100
  var selected = new Set();
  var mode = 'tables';          // 'tables' or 'plusminus'
  var questions = [];
  var current = 0;
  var results = [];
  var startTime = 0;

  // --- Setup screen ---
  var numbersEl = document.getElementById('numbers');
  var startBtn = document.getElementById('startBtn');

  var numBtns = {};

  for (var i = 1; i <= 10; i++) {
    (function (n) {
      var b = document.createElement('button');
      b.className = 'num-btn';
      b.textContent = n;
      b.addEventListener('click', function () {
        if (selected.has(n)) { selected.delete(n); b.classList.remove('selected'); }
        else { selected.add(n); b.classList.add('selected'); }
        updateStart();
      });
      numbersEl.appendChild(b);
      numBtns[n] = b;
    })(i);
  }

  // The chosen tables are remembered, so a child does not have to pick them
  // again every time. Merely touching localStorage can throw (locked-down
  // webviews), hence the try around the access itself.
  var STORE_KEY = 'rekenen.tables.v1';

  function saveSelection() {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(selected)));
    } catch (e) { /* saving failed; the game simply carries on */ }
  }

  function restoreSelection() {
    var stored;
    try {
      stored = JSON.parse(window.localStorage.getItem(STORE_KEY));
    } catch (e) { return; }
    if (!Array.isArray(stored)) return;
    stored.forEach(function (n) {
      // Only real tables 1-10; a junk value must never reach
      // buildTableQuestions().
      if (!Number.isInteger(n) || n < 1 || n > 10) return;
      selected.add(n);
      numBtns[n].classList.add('selected');
    });
  }

  restoreSelection();
  // Needed after restoring: otherwise Start stays disabled while tables are
  // selected. (updateStart is hoisted, so calling it here is fine.)
  updateStart();

  function updateStart() {
    saveSelection();
    if (selected.size > 0) {
      startBtn.disabled = false;
      startBtn.textContent = 'Start';
    } else {
      startBtn.disabled = true;
      startBtn.textContent = 'Start (kies minstens één)';
    }
  }

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  // By shuffling the pool and taking the first questions off it, the same
  // question can never come up twice in one game.
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(0, i);
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  // Adds a question to the pool, but skips one that is already in it apart
  // from the order of the numbers: to a child 3 × 4 and 4 × 3 are the same
  // question, so it goes into the pool only once.
  function addUnique(pool, seen, key, q) {
    if (seen[key]) return;
    seen[key] = true;
    pool.push(q);
  }

  function pickQuestions(pool) {
    return shuffle(pool).slice(0, Math.min(NUM_QUESTIONS, pool.length));
  }

  function buildTableQuestions() {
    var bases = Array.from(selected);
    var pool = [];
    var seen = {};
    bases.forEach(function (base) {
      for (var factor = 1; factor <= 10; factor++) {
        var lo = Math.min(base, factor), hi = Math.max(base, factor);
        addUnique(pool, seen, 'x' + lo + '_' + hi,
          { text: factor + ' × ' + base + ' = ?', answer: base * factor });
        addUnique(pool, seen, 'd' + (base * factor) + '_' + base,
          { text: (base * factor) + ' : ' + base + ' = ?', answer: factor });
      }
    });
    return pickQuestions(pool);
  }

  // Addition: a + b with a, b >= 1 and a + b <= 100.
  // Subtraction: a - b with b >= 1 and a - b >= 1, so everything stays
  // between 0 and 100.
  // The pool is far too large to build in full here, so we draw questions
  // until there are enough different ones.
  function buildPlusMinusQuestions() {
    var pool = [];
    var seen = {};
    var tries = 0;
    while (pool.length < NUM_QUESTIONS && tries < 1000) {
      tries++;
      if (Math.random() < 0.5) {
        var a = randInt(2, MAX_VALUE);
        var b = randInt(1, a - 1);
        addUnique(pool, seen, 'm' + a + '_' + b,
          { text: a + ' − ' + b + ' = ?', answer: a - b });
      } else {
        var x = randInt(1, MAX_VALUE - 1);
        var y = randInt(1, MAX_VALUE - x);
        var lo = Math.min(x, y), hi = Math.max(x, y);
        addUnique(pool, seen, 'p' + lo + '_' + hi,
          { text: x + ' + ' + y + ' = ?', answer: x + y });
      }
    }
    return pickQuestions(pool);
  }

  function buildQuestions() {
    return mode === 'plusminus' ? buildPlusMinusQuestions() : buildTableQuestions();
  }

  // --- Screens ---
  var modeEl = document.getElementById('mode');
  var setupEl = document.getElementById('setup');
  var quizEl = document.getElementById('quiz');
  var resultEl = document.getElementById('result');

  var progressEl = document.getElementById('progress');
  var questionEl = document.getElementById('question');
  var answerInput = document.getElementById('answerInput');
  var feedbackEl = document.getElementById('feedback');
  var checkBtn = document.getElementById('checkBtn');
  var nextBtn = document.getElementById('nextBtn');

  function show(el) {
    document.body.classList.toggle('reading', el === resultEl);
    modeEl.classList.add('hidden');
    setupEl.classList.add('hidden');
    quizEl.classList.add('hidden');
    resultEl.classList.add('hidden');
    el.classList.remove('hidden');
  }

  function startQuiz() {
    questions = buildQuestions();
    current = 0;
    results = [];
    startTime = Date.now();
    show(quizEl);
    renderQuestion();
  }

  document.getElementById('modeTablesBtn').addEventListener('click', function () {
    mode = 'tables';
    show(setupEl);
  });

  document.getElementById('modePlusMinusBtn').addEventListener('click', function () {
    mode = 'plusminus';
    startQuiz();
  });

  document.getElementById('backBtn').addEventListener('click', function () {
    show(modeEl);
  });

  startBtn.addEventListener('click', startQuiz);

  function renderQuestion() {
    var q = questions[current];
    progressEl.textContent = 'Vraag ' + (current + 1) + ' van ' + questions.length;
    questionEl.textContent = q.text;
    answerInput.value = '';
    answerInput.className = 'answer-input';
    answerInput.disabled = false;
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    nextBtn.classList.add('hidden');
    checkBtn.classList.remove('hidden');
    checkBtn.disabled = true;
    answerInput.focus();
  }

  function submitAnswer() {
    if (answerInput.disabled) return;
    var raw = answerInput.value.trim();
    if (raw === '') return;
    var given = parseInt(raw, 10);
    var q = questions[current];
    var correct = given === q.answer;

    results.push({ text: q.text, answer: q.answer, given: given, correct: correct });
    answerInput.disabled = true;

    if (correct) {
      answerInput.classList.add('correct');
      feedbackEl.textContent = 'Juist!';
      feedbackEl.className = 'feedback correct';
    } else {
      answerInput.classList.add('wrong');
      feedbackEl.textContent = 'Het juiste antwoord is ' + q.answer;
      feedbackEl.className = 'feedback wrong';
    }

    checkBtn.classList.add('hidden');
    nextBtn.textContent = (current + 1 < questions.length) ? 'Volgende' : 'Bekijk resultaat';
    nextBtn.classList.remove('hidden');
    nextBtn.focus();
  }

  function nextQuestion() {
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      showResults();
    }
  }

  // The answer only appears AFTER Enter (not before). preventDefault +
  // stopPropagation so that the same Enter key does not skip straight on.
  answerInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      submitAnswer();
    }
  });
  // On to the next question: through the button (click, or Enter/space once
  // the button has focus after answering).
  checkBtn.addEventListener('click', submitAnswer);
  // An empty answer cannot be submitted; the button stays disabled.
  answerInput.addEventListener('input', function () {
    checkBtn.disabled = answerInput.value.trim() === '';
  });
  nextBtn.addEventListener('click', nextQuestion);

  // --- Results ---
  function formatDuration(ms) {
    var totalSec = Math.round(ms / 1000);
    var min = Math.floor(totalSec / 60);
    var sec = totalSec % 60;
    if (min > 0) {
      return min + ' min ' + sec + ' sec';
    }
    return sec + ' seconden';
  }

  function showResults() {
    var score = results.filter(function (r) { return r.correct; }).length;
    document.getElementById('score').textContent = score;
    document.getElementById('timeLabel').textContent =
      'Voltooid in ' + formatDuration(Date.now() - startTime);
    var list = document.getElementById('reviewList');
    list.innerHTML = '';
    results.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'review';
      var q = r.text.replace(' = ?', ' = ' + r.answer);
      var right = r.correct
        ? '<span class="mark">✅</span>'
        : '<span class="given">jij: ' + r.given + '</span> <span class="mark">❌</span>';
      row.innerHTML = '<span>' + q + '</span><span>' + right + '</span>';
      list.appendChild(row);
    });
    show(resultEl);
    if (score >= 8) launchConfetti();
  }

  document.getElementById('againBtn').addEventListener('click', function () {
    stopConfetti();
    show(modeEl);
  });

  // --- Background drawings ---
  // The drawings hang in a layer that is as tall as the screen. Left to the
  // viewport, that height shrinks the moment an on-screen keyboard opens,
  // and everything in the lower half slides up and then back down again -
  // exactly the jumping around that #app already avoids. So the height is
  // fixed in pixels once, and only a real change of screen updates it.
  // The width is what tells the two apart: a keyboard never changes it,
  // a rotation or a resized window always does.
  var backdrop = document.getElementById('backdrop');
  var backdropWidth = window.innerWidth;

  function sizeBackdrop() {
    backdropWidth = window.innerWidth;
    backdrop.style.height = window.innerHeight + 'px';
    // A short screen (a phone on its side) has no free middle to fill.
    document.body.classList.toggle('compact', window.innerHeight <= 520);
  }

  sizeBackdrop();

  window.addEventListener('resize', function () {
    if (window.innerWidth === backdropWidth) return;   // a keyboard, not a new screen
    sizeBackdrop();
  });

  // After a rotation the new dimensions are not always in yet when the event
  // arrives, so measure once more a moment later.
  window.addEventListener('orientationchange', function () {
    setTimeout(sizeBackdrop, 300);
  });

  // --- Confetti ---
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var confettiPieces = [];
  var confettiRAF = null;
  var W = 0, H = 0;             // dimensions in CSS pixels
  var COLORS = ['#2563eb', '#16a34a', '#dc2626', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6'];

  // Scales the bitmap with devicePixelRatio (otherwise blurry on retina) and
  // with the screen size (otherwise it is off after rotating the tablet).
  function sizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function onConfettiResize() {
    if (confettiRAF === null) return;
    sizeCanvas();
  }
  window.addEventListener('resize', onConfettiResize);
  window.addEventListener('orientationchange', onConfettiResize);

  function launchConfetti() {
    canvas.classList.remove('hidden');
    sizeCanvas();
    confettiPieces = [];
    for (var i = 0; i < 160; i++) {
      confettiPieces.push({
        x: Math.random() * W,
        y: Math.random() * -H,
        w: 6 + Math.random() * 8,
        h: 8 + Math.random() * 8,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        vy: 2 + Math.random() * 4,
        vx: -1.5 + Math.random() * 3,
        angle: Math.random() * Math.PI * 2,
        spin: -0.15 + Math.random() * 0.3
      });
    }
    var start = null;
    var DURATION = 4500;

    function frame(ts) {
      if (start === null) start = ts;
      var elapsed = ts - start;
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < confettiPieces.length; i++) {
        var p = confettiPieces[i];
        p.y += p.vy;
        p.x += p.vx;
        p.angle += p.spin;
        if (p.y > H + 20) {
          p.y = -20;
          p.x = Math.random() * W;
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.globalAlpha = elapsed > DURATION - 1000 ? Math.max(0, (DURATION - elapsed) / 1000) : 1;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (elapsed < DURATION) {
        confettiRAF = requestAnimationFrame(frame);
      } else {
        stopConfetti();
      }
    }
    confettiRAF = requestAnimationFrame(frame);
  }

  function stopConfetti() {
    if (confettiRAF) { cancelAnimationFrame(confettiRAF); confettiRAF = null; }
    ctx.clearRect(0, 0, W, H);
    canvas.classList.add('hidden');
  }

  document.getElementById('version').textContent = APP_VERSION;

  // --- Service worker ---
  // Relative path: the site lives at /math-game/, not at the root.
  // updateViaCache 'none' keeps a new sw.js from getting stuck behind the
  // HTTP cache of GitHub Pages.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        ['catch'](function () { /* offline will not work then; the game still does */ });
    });

    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    });
  }

})();
</script>
</body>
